name: Build iOS App

on:
    push:
      branches: [ "main", "master", "stream-main" ]
    pull_request:
      branches: [ "main", "master", "stream-main" ]
    workflow_dispatch: # Ti consente di avviarlo manualmente o dopo la sincronizzazione del fork

jobs:
    build:
      name: Build for iOS Simulator
      runs-on: macos-latest
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Select Xcode version
          run: sudo xcode-select -s /Applications/Xcode.app

        - name: Build iOS Project
          run: |
            # Cerca il file .xcodeproj partendo dalla root del repository
            PROJECT_PATH=$(find . -name "*.xcodeproj" | head -n 1)

            if [ -n "$PROJECT_PATH" ]; then
                PROJECT_NAME=$(basename "$PROJECT_PATH" .xcodeproj)
                PROJECT_DIR=$(dirname "$PROJECT_PATH")
                echo "Trovato il progetto in: $PROJECT_DIR (Scheme: $PROJECT_NAME)"

                # Entra nella cartella corretta trovata dal comando find
                cd "$PROJECT_DIR"

                # Compilazione per simulatore iOS disabilitando la firma obbligatoria
                xcodebuild clean build \
                    -project "$(basename "$PROJECT_PATH")" \
                    -scheme "$PROJECT_NAME" \
                    -destination 'platform=iOS Simulator,name=iPhone 16' \
                    CODE_SIGN_IDENTITY="" \
                    CODE_SIGNING_REQUIRED=NO \
                    CODE_SIGN_ENTITLEMENTS=""
            else
                echo "Errore: Nessun file .xcodeproj trovato nella repository."
                exit 1
            fi
