name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build and Upload Simulator App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build iOS Simulator App
        run: |
          xcodebuild clean build \
            -project ios/FamilyStream.xcodeproj \
            -scheme FamilyStream \
            -sdk iphonesimulator \
            -derivedDataPath ./ios/build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamilyStream-Simulator
          path: ios/build/Build/Products/Debug-iphonesimulator/FamilyStream.app
